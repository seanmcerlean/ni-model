name: NI community-identification transition estimate
definition: >
  Annual changes in modelled religion-or-religion-brought-up-in category. These
  are sensitivity assumptions, not observed annual community-background flows.
  They deliberately use only a fraction of observed religious-affiliation
  switching because current affiliation and community background differ.
unit: transitions per 1,000 people in the matching source cohort per year
age_range: [18, 44]
rates:
  catholic_to_none: 0.35
  protestant_to_none: 0.65
  catholic_to_protestant: 0.03
  protestant_to_catholic: 0.03
  none_to_catholic: 3.2
  none_to_protestant: 2.8
  none_to_other: 0.2
  other_to_catholic: 4.0
  other_to_protestant: 3.5
  other_to_none: 1.0
provenance:
  - source: NISRA Census 2021 commissioned table CT0156
    url: https://www.nisra.gov.uk/publications/ct0156-religion-or-religion-brought-combination-family
    use: Direction and scale of child backgrounds in mixed, none and other families.
  - source: Doebler and Shuttleworth 2018, NILS 2001-2011
    url: https://doi.org/10.1111/jssr.12554
    use: Direction, relative Catholic/Protestant difference, age concentration and rarity of direct cross-community switching.
  - source: NISRA Census 2011 and 2021 religion/background totals
    url: https://www.nisra.gov.uk/statistics/census/2021-census/results/main-statistics
    use: Plausibility boundary for aggregate category change.
limitations:
  - No published annual longitudinal transition matrix exists for the four model categories.
  - Family combinations are cross-sectional and do not directly measure adult switching.
  - NILS measures current affiliation rather than the combined upbringing measure.
  - NILT is used only as a directional cross-check, not as a rate calibration.
