name: NI community-background transition assumptions
definition: >
  Time-varying effective changes in the Census religion-or-religion-brought-up-in
  proxy. These are model inputs, not observed annual conversions.
newborn_model:
  household_approximation: one sampled parent
  modern_anchor:
    source: NISRA Census 2021 commissioned table CT0156
    url: https://www.nisra.gov.uk/publications/ct0156-religion-or-religion-brought-combination-family
  effective_2011_plus_probabilities:
    catholic: {catholic: 0.87869, protestant: 0.03076, other: 0.00182, none: 0.08873}
    protestant: {catholic: 0.05421, protestant: 0.75799, other: 0.00309, none: 0.18471}
    other: {catholic: 0.07504, protestant: 0.06600, other: 0.64523, none: 0.21373}
    none: {catholic: 0.08447, protestant: 0.07440, other: 0.00481, none: 0.83632}
adult_response_model:
  start_year: 2001
  age_range: [18, 44]
  destinations: [none]
  interpretation: effective Census response-category change
  fitted_rates_per_1000:
    catholic_to_none: 1.8803650914440153
    protestant_to_none: 4.531752551498318
limitations:
  - CT0156 is cross-sectional and contains two-parent household combinations.
  - Reducing a household to one sampled parent loses assortative-partnership information.
  - Adult rates are inferred within bounds from aggregate trends and are not observed transitions.
  - NILT is not used to set levels or rates.
