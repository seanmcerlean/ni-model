# Northern Ireland Historical Census Benchmarks
# Sources: NISRA Census 1971, 1981, 1991, 2001, 2011, 2021
# Community background uses the Census "religion or religion brought up in"
# measure where available. This is a proxy for community background, not
# current religious practice or voting intention.
# Populations in absolute counts
#
# Primary source:
# NISRA Census 2021, MS-B23 and "Guidance note on use of religion question
# outputs", Table 7:
# https://www.nisra.gov.uk/publications/census-2021-main-statistics-religion-tables
# Topic tables are independently disclosure-controlled. Consequently, MS-B23's
# 2021 categories sum to 1,903,172 while the headline population is 1,903,175.
#
# CAUTION: the comparable combined measure was introduced in 2001. Earlier
# entries below are legacy estimates and must not be treated as a consistent
# time series until they have been rebuilt from source tables.

benchmarks:
  1971:
    total_population: 1536065
    religious_breakdown:
      catholic: 477919      # 31.1%
      protestant: 997383    # 64.9%
      other: 30763          # 2.0%
      none: 30000           # ~2.0% (estimated, not separately recorded)

  1981:
    total_population: 1481959
    # ~7.3% non-response (108,548 persons). Raw responses: Catholic 414,532 / Protestant 892,601 / Other 59,278 / None ~7,000
    # Figures below are non-responses redistributed proportionally across responding groups
    religious_breakdown:
      catholic: 447295      # 30.2% (adjusted from raw 28.0%)
      protestant: 963148    # 65.0% (adjusted from raw 60.2%)
      other: 63963          # 4.3%  (adjusted from raw 4.0%)
      none: 7553            # 0.5%  (adjusted from raw 0.5% — 'none' barely recorded in 1981)

  1991:
    total_population: 1577836
    religious_breakdown:
      catholic: 605639      # 38.4%
      protestant: 788941    # 50.0%
      other: 47335          # 3.0%
      none: 135921          # 8.6%

  2001:
    total_population: 1685267
    religious_breakdown:
      catholic: 737400      # 43.8%
      protestant: 895400    # 53.1%
      other: 6600           # 0.4%
      none: 45900           # 2.7%

  2011:
    total_population: 1810863
    religious_breakdown:
      catholic: 817400      # 45.1%
      protestant: 875700    # 48.4%
      other: 16600          # 0.9%
      none: 101200          # 5.6%

  2021:
    total_population: 1903175
    religious_breakdown:
      catholic: 869753      # 45.7%
      protestant: 827545    # 43.5%
      other: 28514          # 1.5%
      none: 177360          # 9.3%
