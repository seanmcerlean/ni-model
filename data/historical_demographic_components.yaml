limitations:
  - Registration-year births and deaths are used before 2001 and do not align exactly with mid-year intervals.
  - Pre-2001 population adjustment is an accounting residual, not an observed migration series.
  - Post-2001 population adjustment combines NISRA total net migration and other changes so the accounting identity remains explicit.
