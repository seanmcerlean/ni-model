name: Northern Ireland historical demographic components
definition: >
  Annual aggregate controls used by the historical calibration harness. Births
  and deaths are observed registrations. From 2001, migration and other changes
  are NISRA mid-year population components. Before 2001, net population adjustment
  is the transparent residual: next population minus current population minus
  births plus deaths; it therefore includes migration, timing differences and
  population-estimate revisions and must not be interpreted as observed migration.
baseline_population: 1512500
baseline_year: 1969
sources:
  births_1969_2000:
    title: NISRA Live Births 1887-2021
    url: https://www.nisra.gov.uk/publications/birth-statistics
  deaths_1969_2000:
