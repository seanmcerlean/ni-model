services:
  current-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ni_current
      POSTGRES_USER: ni_user
      POSTGRES_PASSWORD: ni_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ni_user -d ni_current"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - current-data:/var/lib/postgresql/data

  current-seed:
    build: .
    environment:
      DATABASE_URL: postgresql://ni_user:ni_password@current-db:5432/ni_current
    command: ["python", "scripts/seed_population.py", "current"]
    depends_on:
      current-db:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ni_user:ni_password@current-db:5432/ni_current
      EMBEDDED_SIMULATION_WORKER: "false"
      CHECKPOINT_DIR: /app/data/checkpoints
      MAX_ACTIVE_RUNS_PER_USER: "2"
      MAX_SIMULATION_HORIZON_YEARS: "100"
    ports:
      - "8000:8000"
    depends_on:
      current-seed:
        condition: service_completed_successfully
    volumes:
      - checkpoints:/app/data/checkpoints

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://ni_user:ni_password@current-db:5432/ni_current
      CHECKPOINT_DIR: /app/data/checkpoints
      SIMULATION_TIMEOUT_SECONDS: "1800"
      SIMULATION_RETENTION_DAYS: "30"
      MAX_CHECKPOINT_BYTES_PER_RUN: "10737418240"
    command: ["python", "scripts/simulation_worker.py"]
    depends_on:
      current-seed:
        condition: service_completed_successfully
    volumes:
      - checkpoints:/app/data/checkpoints

  historical-db:
    image: postgres:15
    profiles: ["historical"]
    environment:
      POSTGRES_DB: ni_historical
      POSTGRES_USER: ni_user
      POSTGRES_PASSWORD: ni_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ni_user -d ni_historical"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - historical-data:/var/lib/postgresql/data

  historical-seed:
    build: .
    profiles: ["historical"]
    environment:
      DATABASE_URL: postgresql://ni_user:ni_password@historical-db:5432/ni_historical
    command: ["python", "scripts/seed_population.py", "historical"]
    depends_on:
      historical-db:
        condition: service_healthy

  benchmark-db:
    image: postgres:15
    profiles: ["performance"]
    environment:
      POSTGRES_DB: ni_benchmark
      POSTGRES_USER: ni_user
      POSTGRES_PASSWORD: ni_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ni_user -d ni_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - benchmark-data:/var/lib/postgresql/data

volumes:
  current-data:
  historical-data:
  checkpoints:
  benchmark-data:
