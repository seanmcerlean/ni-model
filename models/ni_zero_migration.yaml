name: "Zero Net Migration Sensitivity"
baseline_profile: current
baseline_population: 1903175
description: >
  A deterministic sensitivity scenario using the modern fertility and mortality
  assumptions from the historical model, with external and internal net
  migration held at zero. Use it to isolate natural population change.

rate_jitter: 0.0
random_seed: 42
baseline_year: 2021
default_start_year: 2021
default_end_year: 2075

integration_rates:
  - {rate: 0.35, year_min: 2010, destination: NONE, filters: {religious_background: CATHOLIC, age_min: 18, age_max: 44}, evidence: estimated_identity_transition}
  - {rate: 0.65, year_min: 2010, destination: NONE, filters: {religious_background: PROTESTANT, age_min: 18, age_max: 44}, evidence: estimated_identity_transition}
  - {rate: 0.03, year_min: 2010, destination: PROTESTANT, filters: {religious_background: CATHOLIC, age_min: 18, age_max: 44}, evidence: estimated_identity_transition}
  - {rate: 0.03, year_min: 2010, destination: CATHOLIC, filters: {religious_background: PROTESTANT, age_min: 18, age_max: 44}, evidence: estimated_identity_transition}
  - {rate: 3.2, year_min: 2010, destination: CATHOLIC, filters: {religious_background: NONE, age_min: 18, age_max: 44}, evidence: estimated_identity_transition}
  - {rate: 2.8, year_min: 2010, destination: PROTESTANT, filters: {religious_background: NONE, age_min: 18, age_max: 44}, evidence: estimated_identity_transition}
  - {rate: 0.2, year_min: 2010, destination: OTHER, filters: {religious_background: NONE, age_min: 18, age_max: 44}, evidence: estimated_identity_transition}
  - {rate: 4.0, year_min: 2010, destination: CATHOLIC, filters: {religious_background: OTHER, age_min: 18, age_max: 44}, evidence: estimated_identity_transition}
  - {rate: 3.5, year_min: 2010, destination: PROTESTANT, filters: {religious_background: OTHER, age_min: 18, age_max: 44}, evidence: estimated_identity_transition}
  - {rate: 1.0, year_min: 2010, destination: NONE, filters: {religious_background: OTHER, age_min: 18, age_max: 44}, evidence: estimated_identity_transition}

birth_rates:
  - rate: 15.0
    year_min: 2010
    filters: {religious_background: "CATHOLIC"}
  - rate: 11.0
    year_min: 2010
    filters: {religious_background: "PROTESTANT"}
  - rate: 12.0
    year_min: 2010
    filters: {religious_background: "OTHER"}
  - rate: 10.0
    year_min: 2010
    filters: {religious_background: "NONE"}

death_rates:
  - rate: 0.5
    year_min: 2010
    filters: {age_max: 20}
  - rate: 2.0
    year_min: 2010
    filters: {age_min: 21, age_max: 50}
  - rate: 8.0
    year_min: 2010
    filters: {age_min: 51, age_max: 70}
  - rate: 50.0
    year_min: 2010
    filters: {age_min: 71, age_max: 85}
  - rate: 150.0
    year_min: 2010
    filters: {age_min: 86}

migration_rates:
  - rate: 0.0
    year_min: 2010
    filters: {}

internal_migration_rates: []
