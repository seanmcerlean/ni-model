name: NI Current – community-differentiated estimate
baseline_profile: current
baseline_population: 1903175
description: NISRA 2024 principal totals split by community background using conservative
  estimated differentials calibrated to Census 2011–2021 change. Annual component rates are
  normalized to the official starting total. Estimated two-way community-identification
  transitions are included. This sensitivity scenario is not an official projection.
baseline_year: 2021
data_through: 2024
projection_version: Estimated community differential over NISRA/ONS 2024 principal
default_start_year: 2024
default_end_year: 2050
rate_jitter: 0
random_seed: 42
