[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ni-model"
version = "0.4.9"
description = "Northern Ireland Population and Voting Model"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "psycopg2-binary==2.9.9",
    "pandas==2.1.3",
    "numpy==1.26.4",
    "polars>=1.30.0,<2.0.0",
    "pyarrow>=18.0.0,<26.0.0",
    "adbc-driver-postgresql>=1.6.0,<2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pyyaml>=6.0",
    "fastmcp==4.0.0b1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.11.0",
    "flake8==6.1.0",
    "isort==5.12.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["ni_model"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".eggs"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/ni_model --cov-report=term-missing --cov-fail-under=90"
